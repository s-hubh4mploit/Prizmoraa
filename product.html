  <button class="icon-btn" id="searchToggleBtn" aria-label="Search">

  </button>
  <button class="icon-btn" id="wishlistToggleBtn" aria-label="Wishlist">

    <span class="icon-badge" id="cartCount">0</span>
  </button>

<main class="product-page">
<div class="back-home-bar"><a href="index.html" class="back-home-link"><svg viewBox="0 0 24 24"><path d="M15 6l-6 6 6 6"/></svg>Back to Home</a></div>
<div class="wrap">
<div class="prod-layout" id="prodContainer">
<!-- Injected via JS -->
<p style="padding: 100px 0; text-align: center;">Loading luxury product details...</p>
</div>
</div>
</main>

<footer>
<div class="wrap">
<div class="footer-top">
<div>
<span class="logotype">PRIZMORAA</span>
<p class="footer-tagline">The jewellery that reflects light, beauty, and multiple shades of elegance.</p>
</div>
<div class="footer-col">
<h4>Explore</h4>
<a href="collections.html">Collections</a>
</div>
<div class="footer-col">
<h4>Info</h4>
<a href="contact.html">Contact</a>
</div>
<div class="footer-col">
<h4>Follow</h4>
<a href="https://www.instagram.com/prizmoraa?igsh=MzlmajhvMjFkdnM3" target="_blank" rel="noopener">Instagram</a>
</div>
</div>
<div class="footer-bottom">
<span>© 2026 PRIZMORAA. All rights reserved.</span>
<span>Made with care</span>
</div>
</div>
</footer>

<script type="module" src="./js/products.js"></script>
<script type="module" src="./js/main.js"></script>
<script type="module" src="./js/auth.js"></script>
<script type="module" src="./js/cart.js"></script>
<script>
document.addEventListener('DOMContentLoaded', async () => {
const { getProductById, getEffectivePrice } = window.PrizmoraaProducts;
const params = new URLSearchParams(window.location.search);
const id = params.get('id');
const product = await getProductById(id);
const container = document.getElementById('prodContainer');
if (!product) {
container.innerHTML = '<p style="grid-column:1/-1; text-align:center; padding: 100px 0;">Product not found. <a href="collections.html" style="color:var(--gold); text-decoration:underline;">Return to collections</a></p>';
return;
}
document.title = `PRIZMORAA — ${product.name}`;
const productImages = (product.images && product.images.length > 0) ? product.images : [product.image || 'images/hero.jpg'];
const mainImgSrc = productImages[0];
const thumbsHtml = productImages.length > 1 ? `
<div class="prod-thumbs">
${productImages.map((img, idx) => `
<button class="thumb-btn ${idx === 0 ? 'active' : ''}" data-src="${encodeURI(img)}" aria-label="View photo ${idx + 1}">
<img src="${encodeURI(img)}" alt="${product.name} view ${idx + 1}">
</button>
`).join('')}
</div>
` : '';

const inStock = Number.isFinite(product.stock) ? product.stock > 0 : true;
const showLowStock = inStock && product.lowStockAlert && Number.isFinite(product.stock);
const effPrice = getEffectivePrice(product);
const hasDiscount = effPrice < product.price;

container.innerHTML = `
<div class="prod-gallery">
<div class="prod-main-img">
<img id="mainProductImg" src="${encodeURI(mainImgSrc)}" alt="${product.name}">
</div>
${thumbsHtml}
</div>
<div class="prod-details">
<span class="eyebrow"><span class="dot"></span> PRIZMORAA SIGNATURE • ${product.category.toUpperCase()} • ${product.subcategory.toUpperCase()}</span>
<h1>${product.name}</h1>
<div class="price-row">
<span class="prod-price">₹${effPrice.toLocaleString('en-IN')}</span>
${hasDiscount ? `<s class="price-was">₹${product.price.toLocaleString('en-IN')}</s><span class="discount-tag">${product.discountPercent}% OFF</span>` : ''}
<span class="tax-tag">(Taxes Included · Delivered in 5-7 Days)</span>
</div>
<span class="stock-status ${inStock ? (showLowStock ? 'low-stock' : 'in-stock') : 'out-of-stock'}">${inStock ? (showLowStock ? `● Only ${product.stock} left in stock` : '● Available in Stock') : '● Out of Stock'}</span>
<div class="prod-desc-box">
<p>${product.desc}</p>
</div>
<div class="highlights-grid">
<div class="highlight-chip">
<span class="icon">✨</span>
<span>18K Gold / Rhodium Plated</span>
</div>
<div class="highlight-chip">
<span class="icon">💎</span>
<span>AAA+ Cubic Zirconia / Pearls</span>
</div>
<div class="highlight-chip">
<span class="icon">🌿</span>
<span>Anti-Tarnish & Hypoallergenic</span>
</div>
</div>
<div class="prod-actions">
<button class="btn" id="addToBagBtn" ${inStock ? '' : 'disabled'}
  data-id="${product.id}" data-name="${product.name}" data-price="${effPrice}" data-image="${encodeURI(mainImgSrc)}" data-stock="${Number.isFinite(product.stock) ? product.stock : ''}"
  onclick="window.PrizmoraaCart.addFromBtn(this)">
  ${inStock ? 'Add to Bag' : 'Out of Stock'}
</button>
${!inStock ? `
<button class="btn btn-notify" id="notifyMeBtn">Notify Me When Available</button>
<p class="notify-error" id="notifyMeError" style="display:none; color:#b3261e; font-size:13px; margin:8px 0 0;"></p>
` : ''}
</div>
<div class="accordion">
<div class="acc-item active">
<button class="acc-header">Craftsmanship & Materials <span class="icon">▼</span></button>
<div class="acc-content">
<p>Every PRIZMORAA piece is thoughtfully chosen and crafted with high-grade anti-tarnish protective coating over 18k champagne gold or rhodium silver. Embellished with hand-set AAA+ cubic zirconia crystals for breathtaking brilliance.</p>
</div>
</div>
<div class="acc-item">
<button class="acc-header">Care Instructions <span class="icon">▼</span></button>
<div class="acc-content">
<p>To maintain your jewellery's original luster, store in a cool, dry place when not in use. Avoid direct contact with perfumes, hairsprays, and harsh chemicals.</p>
</div>
</div>
<div class="acc-item">
<button class="acc-header">Shipping <span class="icon">▼</span></button>
<div class="acc-content">
<p>We offer insured shipping across India in 5-7 working days. Every order is carefully packed to ensure your jewellery arrives in perfect condition.</p>
</div>
</div>
</div>
</div>
`;

// Gallery thumbnail switcher logic
const mainImg = document.getElementById('mainProductImg');
const thumbBtns = document.querySelectorAll('.thumb-btn');
thumbBtns.forEach(btn => {
btn.addEventListener('click', () => {
thumbBtns.forEach(b => b.classList.remove('active'));
btn.classList.add('active');
const newSrc = btn.getAttribute('data-src');
mainImg.style.opacity = '0.2';
setTimeout(() => {
mainImg.src = newSrc;
mainImg.style.opacity = '1';
}, 150);
});
});

// Accordion Logic
document.querySelectorAll('.acc-header').forEach(btn => {
btn.addEventListener('click', function() {
this.parentElement.classList.toggle('active');
});
});

// "Notify Me When Available" — requires sign-in; if the customer isn't
// logged in, prompts login via the account panel and finishes the
// subscription automatically once sign-in succeeds.
const notifyBtn = document.getElementById('notifyMeBtn');
if (notifyBtn) {
const notifyError = document.getElementById('notifyMeError');

function setNotifySubscribed() {
notifyBtn.textContent = "You're on the list ✓";
notifyBtn.disabled = true;
}

async function subscribeToRestock() {
notifyError.style.display = 'none';
const originalText = notifyBtn.textContent;
notifyBtn.disabled = true;
notifyBtn.textContent = 'Submitting...';
try {
const token = window.PrizmoraaAuth.getToken();
const res = await fetch('/api/notify-stock', {
method: 'POST',
headers: { 'Content-Type': 'application/json', Authorization: `Bearer ${token}` },
body: JSON.stringify({ productId: product.id }),
});
const data = await res.json().catch(() => ({}));
if (!res.ok) throw new Error(data.error || 'Something went wrong. Please try again.');
setNotifySubscribed();
} catch (err) {
notifyBtn.disabled = false;
notifyBtn.textContent = originalText;
notifyError.textContent = err.message || 'Something went wrong. Please try again.';
notifyError.style.display = 'block';
}
}

notifyBtn.addEventListener('click', () => {
if (window.PrizmoraaAuth && window.PrizmoraaAuth.isLoggedIn()) {
subscribeToRestock();
return;
}
// Not signed in — open the login panel, then finish subscribing
// automatically once sign-in succeeds (any method: password, Google,
// phone/email OTP all funnel through this same event).
window.PrizmoraaCart.openPanel('account');
window.addEventListener('prizmoraa:auth-login', function onLogin() {
window.removeEventListener('prizmoraa:auth-login', onLogin);
subscribeToRestock();
});
});

// Reflect existing subscription state on load, if already signed in.
if (window.PrizmoraaAuth && window.PrizmoraaAuth.isLoggedIn()) {
fetch(`/api/notify-stock?productId=${encodeURIComponent(product.id)}`, {
headers: { Authorization: `Bearer ${window.PrizmoraaAuth.getToken()}` },
}).then(res => res.ok ? res.json() : null).then(data => {
if (data && data.subscribed) setNotifySubscribed();
}).catch(() => {});
}
}
});
</script>
</body>
</html>
